# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "no-commit-to-branch" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" }
]

[[repos]]
# fortitude: A Fortran linter, https://fortitude.readthedocs.io/
repo = "https://github.com/PlasmaFAIR/fortitude-pre-commit"
rev = "v0.7.1"
hooks = [
  {
    id = "fortitude",
    args = ["--fix", "src/"],
    pass_filenames = false,
    files = "src/.*[fF]90",
  }
]

[[repos]]
# ruff: A Python linter, https://astral.sh/ruff
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.20"
hooks = [
  {
    id = "ruff-check",
    # The --preview flag enables a much larger set of rules by default
    args = ["--fix", "--preview"],
    files = "interfaces/MACE/mace_server.py",
  },
  {
    id = "ruff-format",
    files = "interfaces/MACE/mace_server.py",
  }
]

# Verify Github workflows have correct syntax
[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.30.0"
hooks = [
  {
    id = "check-github-workflows"
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "format",
    name = "Format Fortran code",
    language = "python",
    entry = "./autoformat.py",
    types = ["fortran"],
    pass_filenames = true,
    # This list must be in sync with .fprettify.rc
    exclude = "interfaces/DFTB-SOCKET-DEV/*|utils/analyze_movie.f90|random.F90|fftw3.F90|force_cp2k.F90|h2o_schwenke.f|h2o_cvrqd.f"
  }
]
